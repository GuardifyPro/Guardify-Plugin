<svg width="64" height="64" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Small-size variant: tighter corner radius and a heavier stroke, because at 16px a
    118px radius reads as a plain circle and a 58px stroke thins out. Optical correction
    at this size cannot come from uniform scaling, so the geometry is adjusted instead of
    the logo simply being reused smaller.
  -->
  <defs>
    <linearGradient id="gf-fav" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#08454A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#gf-fav)"/>

  <path d="M356 158 A142 142 0 1 0 398 256 L296 256"
        stroke="#FFFFFF" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
